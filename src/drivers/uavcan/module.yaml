__max_uavcan_leds: &max_uavcan_leds 8

module_name: UAVCAN
parameters:
- group: UAVCAN
  definitions:
    UAVCAN_ESC_IFACE:
      description:
        short: Which CAN interfaces to output ESC messages on.
        long: |
          Since ESC messages are high priority and sent at a high rate, it is
          recommended to only enable the interfaces that are actually used.
          Otherwise, the ESC messages will arbitrate lower priority messages and
          starve other nodes on the bus.
      type: bitmask
      bit:
        0: CAN1
        1: CAN2
        2: CAN3
        3: CAN4
        4: CAN5
        5: CAN6
        6: CAN7
        7: CAN8
      default: 255
      min: 1
      max: 255
      reboot_required: true
    UAVCAN_LED_EN:
      description:
        short: Enable UAVCAN LEDs with custom light_id values
        long: |
          Enables sending LED commands with custom light_id values.
          Set to 0 to completely disable UAVCAN LED publishing.
          Set to 1 (default) for standard mode with single LED using light_id from UAVCAN_LED_ID0.
          Set to N (2-8) to enable N custom LEDs using UAVCAN_LED_ID0 through UAVCAN_LED_ID(N-1).
          Each enabled LED will use its configured light_id value from the corresponding UAVCAN_LED_IDx parameter.
      type: int32
      min: 0
      max: 8
      default: 1
      reboot_required: true
    UAVCAN_LED_ID${i}:
      description:
        short: UAVCAN LED ${i} light_id
        long: |
          light_id value for LED ${i} in UAVCAN LightsCommand messages.
          This allows addressing specific LEDs on UAVCAN devices with multiple LEDs.
      type: int32
      num_instances: *max_uavcan_leds
      instance_start: 0
      min: 0
      max: 255
      default: 0
actuator_output:
  show_subgroups_if: 'UAVCAN_ENABLE>=3'
  config_parameters:
    - param: 'UAVCAN_ENABLE'
      label: 'Configure'
      function: 'enable'
    - param: 'UAVCAN_BITRATE'
      label: 'Bitrate'
  output_groups:
    - param_prefix: UAVCAN_EC
      group_label: 'ESCs'
      channel_label: 'ESC'
      standard_params:
        min: { min: 0, max: 8191, default: 1 }
        max: { min: 0, max: 8191, default: 8191 }
        failsafe: { min: 0, max: 8191 }
      num_channels: 8
    - param_prefix: UAVCAN_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: 8
